services:
  backend:
    image: brczk/exercises-docker-basics-1_14-backend
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis_cache
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
  redis_cache:
    image: redis
    volumes:
      - redis:/data
  postgres:
    image: postgres:18
    volumes:
      - ./database:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
  frontend:
    image: brczk/exercises-docker-basics-1_14-frontend
    ports:
      - 127.0.0.1:5001:5001
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080
volumes:
  redis:
    