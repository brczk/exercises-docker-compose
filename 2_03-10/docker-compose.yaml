services:
  backend:
    image: brczk/exercises-docker-basics-1_14-backend
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - REQUEST_ORIGIN=http://localhost:8000
      - REDIS_HOST=redis_cache
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
  redis_cache:
    image: redis
  postgres:
    image: postgres:18
    volumes:
      - ./database:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
    - 8000:80

  frontend:
    image: brczk/exercises-docker-basics-1_14-frontend
    ports:
      - 127.0.0.1:5001:5001
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000/api
    